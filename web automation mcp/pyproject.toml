[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-browser-agent"
version = "0.1.0"
description = "MCP server exposing browser automation with browser-use"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "madhav" }]
dependencies = [
  "fastmcp>=4.1.3,<5",
  "browser-use>=0.11.13,<0.12",
  "playwright>=1.64.0,<2",
  "openai>=2.54.0,<3",
  "pydantic>=2.14.1,<3",
  "pydantic-settings>=2.16.1,<3",
  "python-dotenv>=1.2.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.17.1,<0.18",
]

[project.scripts]
mcp-browser-agent = "mcp_browser_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_browser_agent = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that drive the real MCP server surface",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "PL", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"examples/**" = ["S105", "S106", "T201"]
